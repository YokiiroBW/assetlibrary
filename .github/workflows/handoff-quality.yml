name: Handoff quality gates

on:
  push:
  pull_request:

jobs:
  fast-merge:
    name: fast-merge-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_HOME: ${{ github.workspace }}/.runtime/dotnet-home
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.runtime/nuget
      GRADLE_USER_HOME: ${{ github.workspace }}/.runtime/gradle-home
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: |
            packages/sdk/assetlink/typescript/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            services/core-server/packages.lock.json
            services/worker-supervisor/packages.lock.json
            packages/sdk/assetlink/dotnet/packages.lock.json
            tests/dotnet/AssetLibrary.AssetLink.Tests/packages.lock.json
            tests/dotnet/AssetLibrary.Build.Tests/packages.lock.json
            tests/dotnet/AssetLibrary.ReadCore.Tests/packages.lock.json
            tests/dotnet/AssetLibrary.TaskHealth.Tests/packages.lock.json
            tests/dotnet/AssetLibrary.WebGateway.Tests/packages.lock.json
      - name: Repository verification entry
        run: python scripts/verify_repository.py
      - name: V0.1 Alpha integration audit
        run: python -I -B scripts/validate_v0_1_alpha.py
      - name: Repository workflow tests
        run: python -m unittest discover -s tests/repository -p test_*.py -v
      - name: Database migration manifest validation
        run: python -B database/migrations/production/migration_tool.py validate
      - name: Database migration static tests
        run: python -B -m unittest discover -s tests/database -p test_migration_manifest.py -v
      - name: Web Gateway migration static tests
        run: python -B -m unittest discover -s tests/database -p test_web_gateway_migrations.py -v
      - name: AssetLink generated SDK tests
        run: python -B -m unittest discover -s tests/sdk -p test_*.py -v
      - name: AssetLink contract regression tests
        run: python -B -m unittest discover -s tests/spikes/assetlink -p test_*.py -v
      - name: Verify scoped V0.1 start gate
        run: python tests/architecture/check_release_gates.py --target v0.1-start
      - name: Locked .NET restore
        run: dotnet restore AssetLibrary.slnx --locked-mode
      - name: .NET formatting and analyzer gate
        run: dotnet format AssetLibrary.slnx --verify-no-changes --no-restore
      - name: .NET Release build
        run: dotnet build AssetLibrary.slnx --configuration Release --no-restore
      - name: .NET tests
        run: dotnet test AssetLibrary.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
      - name: NuGet vulnerability query
        shell: bash
        run: dotnet package list --project AssetLibrary.slnx --include-transitive --vulnerable --no-restore --format json --output-version 1 > .runtime/dotnet-vulnerabilities.json
      - name: NuGet lock and license gate
        run: python scripts/validate_dotnet_dependencies.py --solution AssetLibrary.slnx --packages-dir .runtime/nuget --vulnerability-report .runtime/dotnet-vulnerabilities.json
      - name: Duplicate source and sensitive-log gate
        run: python scripts/validate_dotnet_source.py
      - name: Generated SDK drift and source boundary gate
        run: python -B scripts/generate_assetlink_sdks.py --check
      - name: AssetLink SDK source policy
        run: python -B scripts/validate_assetlink_sdk_source.py
      - name: Frozen TypeScript install
        run: pnpm --dir packages/sdk/assetlink/typescript install --frozen-lockfile
      - name: TypeScript lint
        run: pnpm --dir packages/sdk/assetlink/typescript run lint
      - name: TypeScript typecheck
        run: pnpm --dir packages/sdk/assetlink/typescript run typecheck
      - name: TypeScript build and unit tests
        run: pnpm --dir packages/sdk/assetlink/typescript run test
      - name: TypeScript dependency audit
        run: pnpm --dir packages/sdk/assetlink/typescript audit --audit-level low
      - name: Frozen Web install
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Web formatting gate
        run: pnpm --dir apps/web run format:check
      - name: Web lint gate
        run: pnpm --dir apps/web run lint
      - name: Web typecheck gate
        run: pnpm --dir apps/web run typecheck
      - name: Web production build
        run: pnpm --dir apps/web run build
      - name: Install Playwright Chromium dependencies (Ubuntu)
        if: matrix.label == 'ubuntu'
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: matrix.label == 'windows'
        run: pnpm --dir apps/web exec playwright install chromium
      - name: Web browser regressions
        run: pnpm --dir apps/web run test:browser
      - name: Web dependency audit
        run: pnpm --dir apps/web audit --audit-level low
      - name: Web dependency, license, integrity and size gate
        run: python -B scripts/validate_web_dependencies.py --require-build-artifacts
      - name: Web read-only source boundary gate
        run: python -B scripts/validate_web_source.py
      - name: Kotlin build and SDK tests (Ubuntu)
        if: matrix.label == 'ubuntu'
        run: bash packages/sdk/assetlink/kotlin/gradlew -p packages/sdk/assetlink/kotlin --no-daemon --dependency-verification strict build
      - name: Kotlin build and SDK tests (Windows)
        if: matrix.label == 'windows'
        run: packages/sdk/assetlink/kotlin/gradlew.bat -p packages/sdk/assetlink/kotlin --no-daemon --dependency-verification strict build
      - name: SDK dependency, integrity, license and size gate
        run: python -B scripts/validate_assetlink_sdk_dependencies.py --require-build-artifacts

  fast-merge-database:
    name: fast-merge-database-postgresql-16.15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASSETLIBRARY_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      ASSETLIBRARY_TEST_POSTGRES_REQUIRED: '1'
      ASSETLIBRARY_TEST_POSTGRES_EXTERNAL: '1'
      ASSETLIBRARY_TEST_POSTGRES_HOST: 127.0.0.1
      ASSETLIBRARY_TEST_POSTGRES_PORT: '5432'
      ASSETLIBRARY_TEST_POSTGRES_ADMIN: postgres
      ASSETLIBRARY_TEST_RUNTIME: ${{ github.workspace }}/.runtime/sandbox-storage/V01-006
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Install matching PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          test "$(psql --version | sed -E 's/.* ([0-9]+).*/\1/')" = "16"
      - name: Validate production migration manifest
        run: python -B database/migrations/production/migration_tool.py validate
      - name: Build database-aware CoreServer host
        run: |
          dotnet restore services/core-server/Host/AssetLibrary.CoreServer.Host.csproj --locked-mode
          dotnet build services/core-server/Host/AssetLibrary.CoreServer.Host.csproj --configuration Release --no-restore
      - name: PostgreSQL migration, ownership, backup and restore tests
        run: python -B -m unittest discover -s tests/database -p test_*.py -v
