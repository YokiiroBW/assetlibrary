name: Platform quality gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/spikes/windows-shell/**'
      - 'tests/spikes/file-safety/**'
      - 'tests/spikes/provider-sandbox/**'
      - 'apps/android/**'
      - 'apps/windows-client/**'
      - 'apps/windows-shell/**'
      - 'infra/windows-client/**'
      - 'tests/windows-client/**'
      - 'tests/windows-setup/**'
      - 'tests/windows-shell/**'
      - 'tests/windows-gallery/**'
      - 'contracts/windows-shell/**'
      - 'packages/sdk/assetlink/**'
      - 'packages/ui/**'
      - 'scripts/validate_android_dependencies.py'
      - 'scripts/export_native_theme.py'
      - 'eng/android-dependency-policy.json'
      - '.github/workflows/platform-quality.yml'

jobs:
  platform:
    name: platform-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .runtime/ci | Out-Null
      - name: Windows Shell contract and platform checks
        shell: pwsh
        run: |
          python -m unittest discover -s tests/spikes/windows-shell -p test_*.py -v 2>&1 | Tee-Object -FilePath .runtime/ci/windows-shell-${{ matrix.label }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: File-safety checks
        shell: pwsh
        run: |
          python -m unittest discover -s tests/spikes/file-safety -p test_*.py -v 2>&1 | Tee-Object -FilePath .runtime/ci/file-safety-${{ matrix.label }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provider isolation checks
        shell: pwsh
        run: |
          python -m unittest discover -s tests/spikes/provider-sandbox -p test_*.py -v 2>&1 | Tee-Object -FilePath .runtime/ci/provider-sandbox-${{ matrix.label }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve platform evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-unittest-${{ matrix.label }}
          path: .runtime/ci/*.log
          if-no-files-found: error
          retention-days: 14

  android:
    name: android-native-build-and-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.runtime/gradle-home
      ANDROID_SERIAL: emulator-5554
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # setup-java compares the complete Adoptium SemVer build metadata.
          java-version: '21.0.12+8.0.LTS'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator access on the isolated CI runner
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Native Android checks on API 36
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          port: 5554
          disable-animations: true
          script: |
            sdkmanager 'build-tools;36.0.0'
            python -I -B scripts/export_native_theme.py --check
            bash apps/android/gradlew -p apps/android --no-daemon --dependency-verification strict :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:dependencyInventory
            python -I -B scripts/validate_android_dependencies.py --inventory apps/android/app/build/reports/runtime-dependency-inventory.tsv --gradle-cache .runtime/gradle-home --apk apps/android/app/build/outputs/apk/debug/app-debug.apk --audit-output .runtime/android-dependency-audit.json
            bash apps/android/gradlew -p apps/android --no-daemon --dependency-verification strict :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.assetlibrary.android.WorkspaceUiTest
      - name: Preserve native Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-evidence
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/apk/debug/
            .runtime/android-dependency-audit.json
          if-no-files-found: error
          retention-days: 14

  windows-read-adapter:
    name: windows-read-adapter-and-shell-build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_HOME: ${{ github.workspace }}/.runtime/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/.runtime/nuget
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Windows adapter locks
        run: dotnet restore apps/windows-client/AssetLibrary.Windows.slnx --locked-mode
      - name: Verify Windows adapter formatting
        run: dotnet format apps/windows-client/AssetLibrary.Windows.slnx --verify-no-changes --no-restore
      - name: Build Windows adapter
        run: dotnet build apps/windows-client/AssetLibrary.Windows.slnx --configuration Release --no-restore
      - name: Windows protocol and state contracts
        run: dotnet test apps/windows-client/AssetLibrary.Windows.slnx --configuration Release --no-build --no-restore --filter "TestCategory!=NativeLive"
      - name: Windows dependency audit
        run: dotnet package list --project apps/windows-client/AssetLibrary.Windows.slnx --include-transitive --vulnerable --no-restore --format json --output-version 1 > .runtime/windows-vulnerabilities.json
      - name: Windows dependency licenses and locks
        run: python scripts/validate_dotnet_dependencies.py --solution apps/windows-client/AssetLibrary.Windows.slnx --packages-dir .runtime/nuget --vulnerability-report .runtime/windows-vulnerabilities.json
      - name: Configure test-only native Shell adapter
        run: cmake -S tests/windows-shell -B .runtime/explorer-proof -G "Visual Studio 17 2022" -A x64
      - name: Compile test-only native Shell adapter
        run: cmake --build .runtime/explorer-proof --config Release --parallel 2
      - name: Native Shell regression tests
        run: ctest --test-dir .runtime/explorer-proof -C Release --output-on-failure
      - name: Verify generated native theme
        run: python -I -B scripts/export_native_theme.py --check
      - name: Configure native gallery control tests
        run: cmake -S tests/windows-gallery -B .runtime/gallery-surface -G "Visual Studio 17 2022" -A x64
      - name: Build native gallery control tests
        run: cmake --build .runtime/gallery-surface --config Release --parallel 2
      - name: Native gallery layout rendering and accessibility
        run: ctest --test-dir .runtime/gallery-surface -C Release --output-on-failure
      - name: Explorer release permission
        run: python tests/architecture/check_release_gates.py --target explorer-v0.5
      - name: Configure production Explorer component
        run: cmake -S apps/windows-shell -B .runtime/explorer-product -G "Visual Studio 17 2022" -A x64
      - name: Compile production Explorer component
        run: cmake --build .runtime/explorer-product --config Release --parallel 2
      - name: Windows setup contracts
        run: dotnet test tests/windows-setup/AssetLibrary.Windows.Setup.Tests.csproj --configuration Release
      - name: Windows package boundary tests
        run: python -I -B -m unittest discover -s tests/windows-setup -p test_package.py -v
      - name: Build complete self-contained Windows preview
        shell: pwsh
        run: |
          $notices = @(Get-ChildItem infra/windows-client/notices -File | Where-Object { $_.Name -ne '.gitattributes' } | ForEach-Object { '--notice'; $_.FullName })
          python -I -B infra/windows-client/build_package.py --build-root .runtime/windows-package-build --output .runtime/AssetLibrary-win-x64 @notices
      - name: Audit exact Windows release locks and licenses
        run: python -I -B scripts/validate_windows_release_locks.py --packages-dir .runtime/nuget
      - name: Preserve adapter build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-read-adapter-evidence
          path: |
            .runtime/windows-vulnerabilities.json
            .runtime/explorer-proof/CMakeCache.txt
            .runtime/gallery-surface/Testing/Temporary/LastTest.log
            .runtime/AssetLibrary-win-x64.zip
            .runtime/AssetLibrary-win-x64.zip.sha256
            .runtime/AssetLibrary-win-x64/build-evidence.json
          if-no-files-found: error
          retention-days: 14
